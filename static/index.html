<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>s.cympfh.cc/video</title>
  <link rel="icon" href="/video/favicon.ico" sizes="64x64">
  <link rel="icon" type="image/png" href="/video/favicon.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f6f6f6;
      color: #222;
    }
    main { width: min(720px, calc(100% - 48px)); }
    label.hint {
      display: block;
      margin: 0 0 0.45rem 0.15rem;
      color: #888;
      font-size: 0.85rem;
    }
    .field {
      position: relative;
    }
    #url {
      width: 100%;
      font-size: 1.6rem;
      padding: 0.7em 2.6em 0.7em 0.8em;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #url.dragover {
      border-color: #339af0;
      background: #e7f5ff;
      box-shadow: 0 0 0 3px rgba(51, 154, 240, 0.35);
    }
    button.clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: #888;
      cursor: pointer;
      padding: 0;
    }
    button.clear:hover { color: #333; }
    button.clear[hidden] { display: none; }
    .result {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 1.2rem;
      min-height: 2.4rem;
    }
    .converted {
      flex: 1;
      color: #888;
      word-break: break-all;
      font-size: 1rem;
      cursor: pointer;
    }
    .converted:empty { cursor: default; }
    .converted:hover:not(:empty) { color: #333; }
    .converted.ok,
    .converted.ok:hover { color: #339af0; }
    button.copy {
      flex: none;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: #888;
      cursor: pointer;
      padding: 0;
    }
    button.copy:hover { color: #333; }
    button.copy.ok { color: #339af0; }
    button.copy[hidden] { display: none; }
    .support {
      margin-top: 1.6rem;
      color: #888;
      font-size: 0.85rem;
    }
    .support strong { cursor: pointer; }
    .error {
      margin: 0.7rem 0 0 0.15rem;
      color: #e03131;
      font-size: 0.9rem;
    }
    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <form id="form" autocomplete="off">
      <label class="hint" for="url">Enter a Video URL or drop an image</label>
      <div class="field">
        <input id="url" type="text" name="url" placeholder="https://" required autofocus>
        <button id="clear" class="clear" type="button" hidden aria-label="クリア">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>
        </button>
      </div>
    </form>
    <p id="error" class="error" hidden role="alert"></p>
    <div class="result">
      <div id="converted" class="converted"></div>
      <button id="copy" class="copy" type="button" hidden aria-label="コピー">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2"></rect>
          <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
        </svg>
      </button>
    </div>
    <p class="support">Supporting<br><strong id="fill-youtube">YouTube</strong> / <strong id="fill-niconico">niconico</strong> / <strong id="fill-bilibili">bilibili</strong> / <strong id="fill-x">X</strong> / <strong id="fill-iwara">iwara</strong></p>
  </main>
  <script>
    const input = document.getElementById("url");
    const converted = document.getElementById("converted");
    const copy = document.getElementById("copy");
    const clear = document.getElementById("clear");
    const error = document.getElementById("error");
    let uploading = false;

    function clearError() {
      error.hidden = true;
      error.textContent = "";
    }

    function showError(message) {
      error.hidden = false;
      error.textContent = message;
    }

    function sourceUrl() {
      const value = input.value.trim();
      if (!value) return "";
      if (value.startsWith("sm") || value.startsWith("so")) {
        return "https://www.nicovideo.jp/watch/" + value;
      }
      if (value.startsWith("BV")) {
        return "https://www.bilibili.com/video/" + value;
      }
      return value;
    }

    function built() {
      const value = sourceUrl();
      if (!value) return "";
      return "https://s.cympfh.cc/video?url=" + encodeURIComponent(value);
    }

    function render() {
      clearError();
      const href = built();
      converted.textContent = href;
      copy.hidden = !href;
      clear.hidden = !input.value;
    }

    input.addEventListener("input", render);
    clear.addEventListener("click", () => {
      input.value = "";
      render();
      input.focus();
    });
    document.getElementById("fill-youtube").addEventListener("click", () => {
      input.value = "https://www.youtube.com/watch?v=y9QQS1a1Mzs";
      render();
    });
    document.getElementById("fill-niconico").addEventListener("click", () => {
      input.value = "https://www.nicovideo.jp/watch/sm29550180";
      render();
    });
    document.getElementById("fill-bilibili").addEventListener("click", () => {
      input.value = "https://www.bilibili.com/video/BV1o5411R7vM";
      render();
    });
    document.getElementById("fill-x").addEventListener("click", () => {
      input.value = "https://x.com/pa_draws/status/1849228056537497835";
      render();
    });
    document.getElementById("fill-iwara").addEventListener("click", () => {
      input.value = "https://www.iwara.tv/video/SLKmO41sKBLOHr";
      render();
    });
    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      render();
    });
    async function copyBuilt() {
      const href = built();
      if (!href) return;
      await navigator.clipboard.writeText(href);
      copy.classList.add("ok");
      converted.classList.add("ok");
      setTimeout(() => {
        copy.classList.remove("ok");
        converted.classList.remove("ok");
      }, 1000);
    }
    copy.addEventListener("click", copyBuilt);
    converted.addEventListener("click", copyBuilt);

    function rejectedFile(file) {
      if (!file) return true;
      if (!file.type || file.type === "application/octet-stream") return false;
      return !file.type.startsWith("image/");
    }

    const MAX_WIDTH = 1920;
    const MAX_HEIGHT = 1080;
    const UPLOAD_BUDGET = 900 * 1024;

    function detailText(data) {
      if (!data || typeof data !== "object") return "";
      if (typeof data.detail === "string" && data.detail && !data.detail.includes("<")) {
        return data.detail;
      }
      if (Array.isArray(data.detail) && data.detail[0] && typeof data.detail[0].msg === "string") {
        return data.detail[0].msg;
      }
      return "";
    }

    function uploadFailureMessage(status, data) {
      const detail = detailText(data);
      if (status === 413) {
        return detail || "This image is too large to upload.";
      }
      if (status === 400) {
        return detail || "This file was rejected. Drop an image the server can accept.";
      }
      if (status >= 500) {
        return "The server could not store this image. Try again.";
      }
      return detail || "Upload failed (" + status + ").";
    }

    function roundHalfUp(value) {
      return Math.floor(value + 0.5);
    }

    function fittedSize(width, height) {
      if (width <= MAX_WIDTH && height <= MAX_HEIGHT) {
        return { width: width, height: height };
      }
      const scale = Math.min(MAX_WIDTH / width, MAX_HEIGHT / height);
      return {
        width: Math.max(1, Math.min(MAX_WIDTH, roundHalfUp(width * scale))),
        height: Math.max(1, Math.min(MAX_HEIGHT, roundHalfUp(height * scale))),
      };
    }

    function blobType(type) {
      if (type === "image/jpeg" || type === "image/webp") return type;
      return "image/png";
    }

    function fileFromBlob(blob, originalName, type) {
      const ext = type === "image/jpeg" ? ".jpg" : type === "image/webp" ? ".webp" : ".png";
      const base = (originalName || "image").replace(/\.[^.]+$/, "") || "image";
      return new File([blob], base + ext, { type: blob.type || type });
    }

    function encodeCanvas(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), type, quality);
      });
    }

    async function encodeFit(bitmap, width, height, type, quality, originalName) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      if (type === "image/jpeg") {
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, width, height);
      }
      context.drawImage(bitmap, 0, 0, width, height);
      const blob = await encodeCanvas(canvas, type, quality);
      if (!blob) return null;
      return fileFromBlob(blob, originalName, type);
    }

    async function shrinkToBudget(bitmap, width, height, originalName) {
      const qualities = [0.86, 0.72, 0.58, 0.44, 0.3, 0.18];
      const scales = [1, 0.75, 0.5, 0.35];
      for (const scale of scales) {
        const scaledWidth = Math.max(1, Math.min(width, roundHalfUp(width * scale)));
        const scaledHeight = Math.max(1, Math.min(height, roundHalfUp(height * scale)));
        for (const quality of qualities) {
          for (const type of ["image/jpeg", "image/webp"]) {
            const candidate = await encodeFit(
              bitmap, scaledWidth, scaledHeight, type, quality, originalName
            );
            if (candidate && candidate.size <= UPLOAD_BUDGET) return candidate;
          }
        }
      }
      return null;
    }

    async function prepareUpload(file) {
      let bitmap;
      try {
        bitmap = await createImageBitmap(file);
      } catch (e) {
        if (file.size <= UPLOAD_BUDGET) return file;
        throw new Error("too-large");
      }
      try {
        if (!bitmap.width || !bitmap.height) {
          if (file.size <= UPLOAD_BUDGET) return file;
          throw new Error("too-large");
        }
        const size = fittedSize(bitmap.width, bitmap.height);
        const fitsBox = size.width === bitmap.width && size.height === bitmap.height;
        if (fitsBox && file.size <= UPLOAD_BUDGET) return file;
        const typed = await encodeFit(
          bitmap, size.width, size.height, blobType(file.type), 0.92, file.name
        );
        if (typed && typed.size <= UPLOAD_BUDGET) return typed;
        const shrunk = await shrinkToBudget(bitmap, size.width, size.height, file.name);
        if (shrunk) return shrunk;
        throw new Error("too-large");
      } finally {
        bitmap.close();
      }
    }

    async function uploadImage(file) {
      if (uploading) return;
      clearError();
      if (rejectedFile(file)) {
        showError("Drop an image file.");
        return;
      }
      uploading = true;
      converted.textContent = "Uploading…";
      copy.hidden = true;
      try {
        let prepared;
        try {
          prepared = await prepareUpload(file);
        } catch (e) {
          render();
          showError("This image is too large to upload. It could not be reduced under 900KB.");
          return;
        }
        if (prepared.size > UPLOAD_BUDGET) {
          render();
          showError("This image is too large to upload. It could not be reduced under 900KB.");
          return;
        }
        const body = new FormData();
        body.append("file", prepared, prepared.name || "image");
        let response;
        try {
          response = await fetch("/video/upload", { method: "POST", body });
        } catch (e) {
          render();
          showError("Could not reach the server. Check your connection and try again.");
          return;
        }
        const raw = await response.text();
        let data = {};
        try {
          data = JSON.parse(raw);
        } catch (e) {
          data = {};
        }
        if (!response.ok || !data.path || !data.path.startsWith("/video/uploads/")) {
          render();
          showError(uploadFailureMessage(response.status, data));
          return;
        }
        input.value = location.origin + data.path;
        clearError();
        render();
      } finally {
        uploading = false;
        input.classList.remove("dragover");
      }
    }

    input.addEventListener("dragenter", (event) => {
      event.preventDefault();
      input.classList.add("dragover");
    });
    input.addEventListener("dragover", (event) => {
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      input.classList.add("dragover");
    });
    input.addEventListener("dragleave", () => {
      if (!uploading) input.classList.remove("dragover");
    });
    input.addEventListener("drop", (event) => {
      event.preventDefault();
      if (!uploading) input.classList.remove("dragover");
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      uploadImage(file);
    });
  </script>
</body>
</html>
